services:

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-Europe/Amsterdam}
    ports:
      - "8191:8191"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Amsterdam}
    volumes:
      - prowlarr-config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  auto-magnet:
    build: .
    container_name: auto-magnet
    depends_on:
      - prowlarr
    environment:
      # Transmission — your existing instance on the network
      - TRANSMISSION_HOST=${TRANSMISSION_HOST}
      - TRANSMISSION_PORT=${TRANSMISSION_PORT:-9091}
      - TRANSMISSION_USER=${TRANSMISSION_USER:-}
      - TRANSMISSION_PW=${TRANSMISSION_PW:-}
      # Download paths as seen by Transmission on its host
      - MOVIEPATH=${MOVIEPATH}
      - SHOWSPATH=${SHOWSPATH}
      # Prowlarr — container on the internal Docker network
      - PROWLARR_HOST=prowlarr
      - PROWLARR_PORT=9696
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:-}
      # TMDB & search
      - TMDB_API_KEY=${TMDB_API_KEY}
      - MIN_SEEDS=${MIN_SEEDS:-10}
      - DEFAULT_QUALITY=${DEFAULT_QUALITY:-1080p}
      # App
      - AMAGNET_PORT=62201
      - DB_PATH=/data/auto_magnet.db
      # Browser-playable versions of files that need converting. Roughly the
      # size of the originals they are made from, so keep it on a big disk.
      - WEB_PATH=/web
      # Optional shared secret for scripts; also required to create the first
      # account when set.
      - AMAGNET_TOKEN=${AMAGNET_TOKEN:-}
      # Set to 1 for a test instance: starts with the scheduler off so nothing
      # is searched for or pushed to Transmission. Leave 0 in production.
      - AMAGNET_NO_SCHEDULER=${AMAGNET_NO_SCHEDULER:-0}
    volumes:
      - auto-magnet-data:/data
      # The media folder, mounted at the SAME path Transmission reports, so the
      # finished-download check can open files without translating paths.
      # Read-write, because fetched subtitles are saved beside the video.
      - ${MEDIA_ROOT:-/HDD0/Shared}:${MEDIA_ROOT:-/HDD0/Shared}
      - ${WEB_ROOT:-./web}:/web
    # The GPU, for hardware encoding (VAAPI). Uncomment on a machine with
    # /dev/dri, and set RENDER_GID in .env to the number `getent group render`
    # prints on the host. Without it, encoding runs on the CPU.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${RENDER_GID}"
    ports:
      - "${AMAGNET_PORT:-62201}:62201"
    restart: unless-stopped

volumes:
  prowlarr-config:
  auto-magnet-data:
